name: t2-token
on:
  push:
    branches: [theme2]
permissions:
  contents: write
jobs:
  write:
    runs-on: ubuntu-24.04
    steps:
      - name: Create a branch with this run's token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ref="t2-$GITHUB_RUN_ID"
          out=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$ref" -f sha="$GITHUB_SHA" 2>&1); rc=$?
          echo "RESULT create exit=$rc"; echo "$out" | head -3
          if [ $rc -eq 0 ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref"; echo "RESULT delete exit=$?"; fi
