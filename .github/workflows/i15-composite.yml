name: i15-composite
on:
  pull_request:
permissions:
  contents: read
jobs:
  j:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/echo
        with:
          text: ${{ github.event.pull_request.title }}
