name: a01-approve
on:
  pull_request:
permissions:
  contents: read
jobs:
  j:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set +e
          out=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" -f event=APPROVE -f body=probe 2>&1); rc=$?
          echo "RESULT approve exit=$rc"; echo "$out" | head -3
