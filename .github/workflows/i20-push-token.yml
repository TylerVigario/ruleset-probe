name: i20-push-token
on:
  push:
    branches: [theme2b]
# The checkout keeps its credential, as it does by default.
permissions:
  contents: write
jobs:
  j:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "${{ github.event.head_commit.message }}"
